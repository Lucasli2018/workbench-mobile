function icon(name, size=22, sw=1.7){
  const path = ICONS[name] || ICONS.grid;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;

function isoToday(){ return new Date().toISOString().slice(0,10); }
function today(){ return isoToday(); }
function avgProgress(list){
  if(!list||!list.length) return { value: 0, sub: "0" };
  const v = Math.round(list.reduce((s,x)=>s+Math.min(100,(x.current/x.target)*100||0),0)/list.length);
  return { value: v, sub: `${list.length} 项` };
}
const modOf = k => CONFIG.modules.find(m=>m.key===k);
const $ = s => document.querySelector(s);

const store = {
  load(){
    const raw = localStorage.getItem(CONFIG.storageKey);
    if(raw){ try { return JSON.parse(raw); } catch(e){} }
    const d = {};
    CONFIG.modules.forEach(m => d[m.key] = structuredClone(m.seed||[]));
    return d;
  },
  save(){ localStorage.setItem(CONFIG.storageKey, JSON.stringify(data)); },
};

/* ---------- ring svg ---------- */
function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

/* ---------- HOME ---------- */
function renderHome(){
  const now = new Date();
  const dow = (now.getDay()+6)%7;               // 周一=0 … 周日=6
  const q = CONFIG.quotes[dow % CONFIG.quotes.length];
  const hour = now.getHours();
  const hi = hour<5?"夜深了":hour<11?"早上好":hour<13?"中午好":hour<18?"下午好":"晚上好";

  // overview rings
  const rings = CONFIG.overview.map(o=>{
    const r=o.calc(data);
    return `<div class="ring" data-open="${o.key}"><div class="dial">${ringSVG(r.value,o.color)}<span class="mid" style="color:${o.color}">${icon(o.icon,23)}</span></div>
      <div class="pct">${r.value}%</div><div class="lbl">${o.label}</div><div class="sub">${r.sub}</div></div>`;
  }).join("");

  // pinned tasks (置顶) — 跨模块收集 item.pinned；就地交互，不跳转
  const pins=[];
  CONFIG.modules.forEach(m=>(data[m.key]||[]).forEach(x=>{ if(x.pinned) pins.push({m,x}); }));
  const chkMark=icon("check",13,2.6);
  const pinSub=(m,x)=>{
    if(m.type==="checkin") return `${m.name} · 连续 ${streak(x.log)} 天`;
    if(m.type==="progress"){ const pct=Math.round((x.current/x.target)*100||0); return `${m.name} · ${x.current}/${x.target} ${x.unit||m.unit||''} · ${Math.min(100,pct)}%`; }
    return m.name;
  };
  const pinCtl=(m,x)=>{
    if(m.type==="checkin"){ const on=!!(x.log&&x.log[today()]); return `<div class="pin-chk js-pin-chk ${on?'on':''}" data-mkey="${m.key}" data-id="${x.id}">${chkMark}</div>`; }
    if(m.type==="todo"){ return `<div class="pin-chk js-pin-chk ${x.done?'on':''}" data-mkey="${m.key}" data-id="${x.id}">${chkMark}</div>`; }
    if(m.type==="progress"){ return `<div class="pin-step"><button class="js-pin-dec" data-mkey="${m.key}" data-id="${x.id}" aria-label="减">−</button><button class="js-pin-inc" data-mkey="${m.key}" data-id="${x.id}" aria-label="加">+</button></div>`; }
    return `<span class="arw">${icon("chevron",14,2)}</span>`;
  };
  const pinned = pins.length ? pins.map(({m,x})=>`<div class="pin">
      <span class="pin-ic" style="color:${m.color}">${icon(m.icon,17)}</span>
      <div class="pin-b js-pin-open" data-mkey="${m.key}" data-id="${x.id}"><div class="pin-t ${(m.type==='todo'&&x.done)?'done':''}">${esc(x.title)}</div><div class="pin-m">${pinSub(m,x)}</div></div>
      ${pinCtl(m,x)}</div>`).join("")
    : `<div class="pin-empty">在任意模块点击 <span class="mini-star">${icon("star",13)}</span> 即可把重要任务置顶到这里</div>`;

  // trend
  const series = CONFIG.trend.series(data);
  const hasTrend = series.length>0;
  const avg = hasTrend ? Math.round(series.reduce((a,b)=>a+b,0)/series.length) : 0;
  const trend = hasTrend ? trendSVG(series)
    : `<div class="trend-empty">${icon("chart",22)}<span>暂无本周数据</span></div>`;

  const quick = CONFIG.quickAdd.map(q=>`<button class="qbtn" data-quick="${q.module}"><span class="e" style="background:${q.tint};color:${q.color}">${icon(q.icon,20)}<i class="qplus">${icon("plus",10,3)}</i></span><span class="l">${q.label}</span></button>`).join("");

  $("#screen").innerHTML = `
    <div class="greet"><div><h1>${hi}</h1><p>欢迎回到${CONFIG.owner}</p></div></div>
    <div class="quote"><span class="tag">${icon("quote",13)} 今日一句</span><div class="txt">${esc(q)}</div></div>
    <div class="sec-title">今日概览</div>
    <div class="card rings">${rings}</div>
    <div class="sec-title">置顶任务</div>
    <div class="pin-list">${pinned}</div>

function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- donut chart (支出占比) ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

/* ---------- calendar grid (打卡月视图) ---------- */
let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev" aria-label="上月">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next" aria-label="下月">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 最长 ${bestStreak(log)} 天 · 本月 ${monthCount}/${days} 天</div>
    <div class="cal-foot">${icon("target",13)} 近7日 ${rateDays(log,7)}/7 · 近30日 ${rateDays(log,30)}/30</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }
    else { mo++; if(mo>11){mo=0;y++;} }
    calMonth={y,m:mo}; render();
  });
  block.querySelectorAll("[data-calitem]").forEach(el=>el.onclick=()=>{ calItemId=+el.dataset.calitem; render(); });
  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{
    const item=it.find(x=>x.id===calItemId)||it[0]; if(!item) return;
    const ds=el.dataset.date; item.log=item.log||{};
    const wasOn=!!item.log[ds];
    const todayIso=isoToday();
    // 今天之前的日期取消打卡：高风险（会断连续），先确认
    if(wasOn && ds<todayIso){
      confirmCalUncheck(item, ds);
      return;
    }
    if(wasOn) delete item.log[ds]; else item.log[ds]=true;
    persist();
    if(wasOn) showCalUndo(item, ds);
  });
}
let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");
  if(!t){ t=document.createElement("div"); t.id="calToast"; t.className="cal-toast"; document.body.appendChild(t); }
  t.innerHTML=`已取消 ${ds.slice(5)} 打卡<button type="button" id="calUndo">撤销</button>`;
  t.classList.add("show");
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); hideCalToast(); };
  clearTimeout(calToastTimer);
  calToastTimer=setTimeout(hideCalToast, 4000);
}
function hideCalToast(){ const t=$("#calToast"); if(t) t.classList.remove("show"); }
function confirmCalUncheck(item, ds){
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>取消打卡</h2>
    <div class="sub">取消 ${ds} 的打卡可能会中断连续天数，确定吗？</div>
    <div class="modal-actions"><button class="btn ghost" id="cu-cancel">保留</button><button class="btn danger" id="cu-ok">取消打卡</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#cu-cancel").onclick=close;
  overlay.querySelector("#cu-ok").onclick=()=>{ delete item.log[ds]; persist(); close(); showCalUndo(item, ds); };
}

/* ===================== P1 图表助手 ===================== */
function fmtMoney(v){ return "¥"+(Math.round((v||0)*100)/100); }
function toDate(s){ return new Date(s+"T00:00:00"); }
function monthKeysBack(n){
  const now=new Date(); const arr=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); arr.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
  return arr;
}
function allMonthKeys(){
  const set=new Set((data.money||[]).filter(x=>x.date).map(x=>x.date.slice(0,7)));
  return [...set].sort();
}
function monthAgg(mk){
  const arr=(data.money||[]).filter(x=>x.date&&x.date.slice(0,7)===mk);
  const inc=arr.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
  const exp=arr.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
  return { inc, exp, bal: inc-exp, n: arr.length };
}
function periodMonths(){
  if(insightPeriod==="all") return allMonthKeys();
  const n={"1m":1,"3m":3,"6m":6,"12m":12}[insightPeriod]||6;
  return monthKeysBack(n);
}
function shortMonth(mk){ const p=mk.split("-"); return (+p[1])+"月"; }

/* 收支趋势：分组柱状(收入/支出) + 结余折线 */
function trendChartSVG(months){
  const W=320,H=180, pl=12,pr=12,pt=14,pb=24;
  const plotW=W-pl-pr, plotH=H-pt-pb;
  const m=months.length; if(!m) return "";
  const maxV=Math.max(1, ...months.map(x=>Math.max(x.inc,x.exp)));
  const band=plotW/m, bw=Math.min(13, band*0.32);
  const bals=months.map(x=>x.bal);
  let bmin=Math.min(...bals), bmax=Math.max(...bals);
  if(bmin===bmax){ bmin-=1; bmax+=1; }
  const yB = v => (pt+plotH) - ((v-bmin)/(bmax-bmin))*(plotH-14) - 7;
  let bars="", line="";
  months.forEach((x,i)=>{
    const cx = pl + band*i + band/2;
    const hi=(x.inc/maxV)*plotH, he=(x.exp/maxV)*plotH;
    bars+=`<rect x="${(cx-bw-1).toFixed(1)}" y="${(pt+plotH-hi).toFixed(1)}" width="${bw}" height="${hi.toFixed(1)}" rx="2" fill="var(--module-1)"/>`;
    bars+=`<rect x="${(cx+1).toFixed(1)}" y="${(pt+plotH-he).toFixed(1)}" width="${bw}" height="${he.toFixed(1)}" rx="2" fill="var(--danger)"/>`;
    line += (i?"L":"M")+(cx).toFixed(1)+" "+yB(x.bal).toFixed(1)+" ";
    if(m<=8 || i===0 || i===m-1 || i%2===0) bars+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--text-tertiary)">${shortMonth(x.mk)}</text>`;
  });
  const base=`<line x1="${pl}" y1="${pt+plotH}" x2="${W-pr}" y2="${pt+plotH}" stroke="var(--border)" stroke-width="0.5"/>`;
  const pline=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${base}${bars}${pline}</svg>`;
}
/* 横向条形排行 */
function hbarSVG(rows){
  if(!rows||!rows.length) return `<div class="chart-empty">暂无数据</div>`;
  const max=Math.max(1,...rows.map(r=>r.value));
  return `<div class="rank-list">`+rows.map(r=>`<div class="rank-row"><span class="rank-name">${esc(r.label)}</span>
    <div class="pbar"><i style="width:${Math.min(100,r.value/max*100).toFixed(1)}%;background:${r.color}"></i></div>
    <span class="rank-val">${r.pct!=null?r.pct+"% · ":""}¥${r.value}</span></div>`).join("")+`</div>`;
}
/* GitHub 风格热力方格（近 weeks 周） */
function heatmapSVG(log, weeks){
  weeks=weeks||12; const cell=12, gap=4, pad=2;
  const total=weeks*7; const todayI=toDate(today());
  let cells="";
  for(let c=0;c<weeks;c++) for(let r=0;r<7;r++){
    const idx=c*7+r; const d=new Date(todayI); d.setDate(d.getDate()-(total-1-idx));
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const on=!!(log&&log[ds]);
    const x=pad+c*(cell+gap), y=pad+r*(cell+gap);
    cells+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2.5" fill="${on?'var(--module-1)':'var(--surface-nested)'}"/>`;
  }
  const W=pad*2+weeks*(cell+gap)-gap, H=pad*2+7*(cell+gap)-gap;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block">${cells}</svg>`;
}
function sparkSVG(vals){
  if(!vals||vals.length<2) return "";
  const W=120,H=32, max=Math.max(...vals,1), min=Math.min(...vals,0), rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-4-((v-min)/rng)*(H-8)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;height:32px;display:block"><polyline points="${pts}" fill="none" stroke="var(--module-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function periodBarHTML(){
  const opts=[["1m","本月"],["3m","近3月"],["6m","近6月"],["12m","近12月"],["all","全部"]];
  return `<div class="period-bar">${opts.map(o=>`<button class="pchip ${insightPeriod===o[0]?'on':''}" data-period="${o[0]}">${o[1]}</button>`).join("")}</div>`;
}
function sectionEmpty(title,msg){ return `<div class="sec-title">${esc(title)}</div><div class="panel"><div class="chart-empty">${esc(msg)}</div></div>`; }

/* ---- P1-1 账本趋势 ---- */
function insightTrend(){
  const months=periodMonths().map(mk=>({mk, ...monthAgg(mk)}));
  if(!months.length || months.every(x=>x.n===0)) return sectionEmpty("账本趋势","还没有记账数据");
  const svg=trendChartSVG(months);
  const last=months[months.length-1], prev=months[months.length-2];
  let delta="";
  if(prev && (prev.inc||prev.exp)){
    const de=last.exp-prev.exp, di=last.inc-prev.inc;
    const pe=prev.exp?Math.round(de/prev.exp*100):0, pi=prev.inc?Math.round(di/prev.inc*100):0;
    delta=`<div class="trend-delta">
      <span>支出 ${fmtMoney(last.exp)} <em class="${de>0?'up':'down'}">${de>0?'▲':'▼'}${Math.abs(pe)}%</em></span>
      <span>收入 ${fmtMoney(last.inc)} <em class="${di>0?'up':'down'}">${di>0?'▲':'▼'}${Math.abs(pi)}%</em></span>
      <span>结余 ${fmtMoney(last.bal)}</span></div>`;
  }
  return `<div class="sec-title">账本趋势</div>
    <div class="panel"><div class="ph">${icon("chart",15)} 收支趋势<span class="avg">${months.length} 个月</span></div>
      <div class="chart-box">${svg}</div>
      <div class="legend-inline"><span><i style="background:var(--module-1)"></i>收入</span><span><i style="background:var(--danger)"></i>支出</span><span><i style="background:var(--accent)"></i>结余</span></div>
      ${delta}</div>`;
}

/* ---- P1-2 账本构成 ---- */
function insightComposition(){
  const months=periodMonths();
  const money=(data.money||[]).filter(x=>x.date&&months.includes(x.date.slice(0,7)));
  const exps=money.filter(x=>x.type==="expense"), incs=money.filter(x=>x.type==="income");
  const totalExp=exps.reduce((s,x)=>s+ +x.amount,0), totalInc=incs.reduce((s,x)=>s+ +x.amount,0);
  const cats=(modOf("money")&&modOf("money").categories)||[];
  const palette=["#10b981","#ef4444","#2563eb","#f59e0b","#8b5cf6","#ec4899","#14b8a6","#64748b"];
  const mkSegs=arr=>cats.map(c=>({cat:c,amount:arr.filter(x=>x.category===c).reduce((s,x)=>s+ +x.amount,0)}))
    .filter(s=>s.amount>0).sort((a,b)=>b.amount-a.amount);
  const expSegs=mkSegs(exps), incSegs=mkSegs(incs);
  expSegs.forEach((s,i)=>s.color=palette[i%palette.length]);
  incSegs.forEach((s,i)=>s.color=palette[i%palette.length]);
  if(!expSegs.length && !incSegs.length) return sectionEmpty("账本构成","该区间暂无记账");
  const donutExp=expSegs.length?donutSVG(expSegs):`<div class="donut-empty">${icon("wallet",22)}<span>暂无支出</span></div>`;
  const donutInc=incSegs.length?donutSVG(incSegs):`<div class="donut-empty">${icon("wallet",22)}<span>暂无收入</span></div>`;
  const legendOf=segs=>{ const t=segs.reduce((a,x)=>a+x.amount,0)||1; return segs.map(s=>`<div class="legend-item"><span class="legend-dot" style="background:${s.color}"></span><span class="legend-name">${esc(s.cat)}</span><span class="legend-amt">¥${s.amount}</span><span class="legend-pct">${Math.round(s.amount/t*100)}%</span></div>`).join(""); };
  const b=data.__budget?+data.__budget:0; const thisExp=monthAgg(today().slice(0,7)).exp;
  const budgetRow=b?`<div class="budget-mini">本月预算执行 <b style="color:${thisExp>b?'var(--danger)':'var(--module-1)'}">${Math.round(thisExp/b*100)}%</b> · ¥${thisExp}/¥${b}</div>`:"";
  return `<div class="sec-title">账本构成</div>
    <div class="panel"><div class="ph">${icon("wallet",15)} 支出构成<span class="avg">合计 ¥${totalExp}</span></div>
      <div class="donut-wrap"><div class="donut">${donutExp}</div><div class="donut-legend">${legendOf(expSegs)}</div></div>
      ${hbarSVG(expSegs.map(s=>({label:s.cat,value:s.amount,color:s.color,pct:Math.round(s.amount/(totalExp||1)*100)})))}

    <div class="panel" style="margin-top:12px"><div class="ph">${icon("wallet",15)} 收入构成<span class="avg">合计 ¥${totalInc}</span></div>
      <div class="donut-wrap"><div class="donut">${donutInc}</div><div class="donut-legend">${legendOf(incSegs)}</div></div></div>`;
}

  if(sport.length) html+=`<div class="panel" style="margin-top:12px"><div class="ph">${icon("activity",15)} 运动累计<span class="avg">${sportDone} ${sport[0].unit||'分钟'}</span></div><div class="mini-stats">${sportStats}</div></div>`;
  // P2-3 近 12 周趋势（仅对开启每周记录的项目）
  const weekly=[...read,...sport].filter(x=>x.period==="week" || (x.log && Object.keys(x.log).length));
  if(weekly.length){
    const rows=weekly.map(x=>{
      const unit=x.unit||"";
      const tgt=Math.max(1,+x.target||1), cur=weekSum(x.log);
      const pct=Math.min(100,Math.round(cur/tgt*100));
      return `<div class="wk-row"><div class="wk-top"><span class="rank-name">${esc(x.title)}</span>
        <span class="rank-val">本周 ${cur}/${tgt}${unit} · ${pct}%</span></div>
        ${sparkSVG(weekSeries(x.log,12))}
        <div class="wk-x"><span>12 周前</span><span>本周</span></div></div>`;
    }).join("");
    html+=`<div class="panel" style="margin-top:12px"><div class="ph">${icon("chart",15)} 近 12 周趋势<span class="avg">每周完成量</span></div>${rows}</div>`;
  }
  return html;
}
function insightRecap(){
  const mk=today().slice(0,7);
  const money=(data.money||[]).filter(x=>x.date&&x.date.slice(0,7)===mk);
  const exp=money.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
  const inc=money.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
  let best=0; (data.checkin||[]).forEach(x=>{ best=Math.max(best, streak(x.log)); });
  const books=(data.read||[]).length, notes=(data.note||[]).length;
  const line=`本月记账 ${money.length} 笔（收 ¥${inc} / 支 ¥${exp}），最长打卡连续 ${best} 天，在读 ${books} 本、灵感 ${notes} 条。`;
  const anoms=[];
  const b=data.__budget?+data.__budget:0;
  if(b && exp>b) anoms.push(`本月支出 ¥${exp} 已超预算 ¥${b}`);
  const lm=(function(){ const d=new Date(); d.setDate(0); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); })();
  const curC={}, lastC={};
  (data.money||[]).filter(x=>x.type==="expense").forEach(x=>{ const k=x.date.slice(0,7);
    if(k===mk) curC[x.category]=(curC[x.category]||0)+ +x.amount;
    if(k===lm) lastC[x.category]=(lastC[x.category]||0)+ +x.amount; });
  let topCat=null, topAmt=0; Object.entries(curC).forEach(([c,v])=>{ if(v>topAmt){ topAmt=v; topCat=c; } });
  if(topCat && lastC[topCat] && topAmt>lastC[topCat]*1.5) anoms.push(`「${topCat}」支出较上月增 ${Math.round((topAmt-lastC[topCat])/lastC[topCat]*100)}%`);
  const report=`【${CONFIG.owner}·月度复盘】本月记账 ${money.length} 笔（收 ¥${inc} / 支 ¥${exp}），最长打卡连续 ${best} 天，在读 ${books} 本、灵感 ${notes} 条。`+(anoms.length?" 提醒："+anoms.join("；"):"");
  return `<div class="sec-title">智能复盘</div>
    <div class="panel"><div class="ph">${icon("chart",15)} 本月一句话</div>
      <p class="recap-line">${esc(line)}</p>
      ${anoms.length?`<div class="anomaly">${icon("bolt",13)} ${anoms.map(esc).join("；")}</div>`:''}
      <button class="btn ghost copy-btn" data-copy="${esc(report)}">复制周报</button></div>`;
}

function renderModule(key){
  const m=modOf(key); const it=data[key]||[];
  const t=today();
  let head="", extra="";
  if(m.type==="finance"){
    const inc=it.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
    const exp=it.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=it.filter(x=>x.done).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已完成", pct);
  } else if(m.type==="checkin"){
    const done=it.filter(x=>x.log&&x.log[t]).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已打卡", pct);
  } else if(m.type==="progress"){
    const p=avgProgress(it);
    head=headHero(m, `${p.value}%`, `平均进度 · ${it.length} 项`, p.value);
  } else if(m.type==="note"){
    const todayN=it.filter(x=>x.date===t).length;
    head=headHero(m, `${it.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }
  if(m.type==="checkin") extra=renderCalendar(m,it);
  if(m.type==="todo") extra=renderTodoArchive();
  const viewIt = (m.type==="finance") ? filterFinance(it) : it;
  const body = !viewIt.length
    ? `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有记录，点上方「新建」添加第一条吧</div></div>`
    : (m.type==="finance" ? renderFinanceGroups(m, viewIt) : it.map(x=>recHTML(m,x)).join(""));

  wireModule(key);
}

function filterFinance(it){
  return it.filter(x=>{
    if(financeFilter.type!=="all" && x.type!==financeFilter.type) return false;
    if(financeFilter.cat!=="all" && (x.category||"")!==financeFilter.cat) return false;
    return true;
  });

/* finance 折叠分组：按 月份 → 日期 两级可折叠 */
function renderFinanceGroups(m, it){
  const CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const sumGroup = arr => {
    const inc = arr.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
    const exp = arr.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
    return { inc, exp, bal: inc-exp };
  };
  const fmtMonth = mk => { const [y,mo]=mk.split("-"); return `${y}年${+mo}月`; };
  const fmtDay = dk => {
    const [y,mo,da]=dk.split("-");
    const w=["周日","周一","周二","周三","周四","周五","周六"][new Date(dk+"T00:00:00").getDay()];
    return `${+mo}月${+da}日 ${w}`;
  };
  const chip = (label,val,cls) => `<span class="gs ${cls}">${label}¥${val}</span>`;
  const sumChips = (s, level) => level==="month"
    ? chip("收 ",s.inc,"inc")+chip("支 ",s.exp,"exp")+chip("结 ",s.bal,"bal")
    : chip("收 ",s.inc,"inc")+chip("支 ",s.exp,"exp");

  const curMonth = today().slice(0,7);
  // 按 月份降序 → 日期降序 排序复制
  const sorted = it.slice().sort((a,b)=>{
    const da = a.date || "9999-99-99", db = b.date || "9999-99-99";
    if(da===db) return (b.id||0)-(a.id||0);
    return da<db ? 1 : -1;
  });
  // 嵌套分组： monthKey -> dayKey -> [items]
  const months = {};
  sorted.forEach(x=>{
    const mk = x.date ? x.date.slice(0,7) : "__nodate";
    const dk = x.date || "__nodate";
    (months[mk] = months[mk] || {});
    (months[mk][dk] = months[mk][dk] || []).push(x);
  });
  const monthKeys = Object.keys(months).sort((a,b)=>{
    if(a==="__nodate") return 1; if(b==="__nodate") return -1;
    return a<b ? 1 : -1;
  });

  return monthKeys.map(mk=>{
    const isCur = mk===curMonth;
    const monthAll = Object.values(months[mk]).flat();
    const ms = sumGroup(monthAll);
    const monthLabel = mk==="__nodate" ? "未标注日期" : fmtMonth(mk);
    const dayKeys = Object.keys(months[mk]).sort((a,b)=>{
      if(a==="__nodate") return 1; if(b==="__nodate") return -1;
      return a<b ? 1 : -1;
    });
    const daysHTML = dayKeys.map(dk=>{
      const arr = months[mk][dk];
      const ds = sumGroup(arr);
      const dayLabel = dk==="__nodate" ? "未标注" : fmtDay(dk);
      return `<div class="grp">
        <div class="grp-head day js-collapse">${CHEV}<span class="grp-title">${dayLabel}</span><span class="grp-sum">${sumChips(ds,"day")}</span></div>
        <div class="grp-body">${arr.map(x=>recHTML(m,x)).join("")}</div>
      </div>`;
    }).join("");
    const budgetRow = renderBudgetRow(ms.exp);
    return `<div class="grp">
      <div class="grp-head month js-collapse ${(data.__financeCollapsed && (mk in data.__financeCollapsed)) ? (data.__financeCollapsed[mk]?'collapsed':'') : (isCur?'':'collapsed')}" data-mk="${mk}">${CHEV}<span class="grp-title">${monthLabel}</span><span class="grp-sum">${sumChips(ms,"month")}</span></div>
      <div class="grp-body">${budgetRow}${daysHTML}</div>
    </div>`;
  }).join("");
}

function renderBudgetRow(exp){
  const b = data.__budget ? +data.__budget : 0;
  if(!b) return `<div class="budget-row"><button class="set-budget js-budget">设置每月预算</button></div>`;
  const pct = Math.min(100, Math.round(exp/b*100));
  const over = exp>b;
  return `<div class="budget-row">
    <div class="bbar"><i style="width:${pct}%;background:${over?'var(--danger)':'var(--module-1)'}"></i></div>
    <span class="bl ${over?'over':''}">已用 ¥${exp} / 预算 ¥${b}${over?` · 超支 ¥${exp-b}`:''}</span>
  </div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

/* P2-3 进度：周起点（周一）与本地日期键 */
function weekStart(d){ const x=new Date(d); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x; }
function dsKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function weekSum(log){
  if(!log) return 0;
  const s0=weekStart(new Date()); let t=0;
  for(let i=0;i<7;i++){ const d=new Date(s0); d.setDate(s0.getDate()+i); t+= (+log[dsKey(d)]||0); }
  return t;
}
function weekSeries(log,n){
  const out=[], s0=weekStart(new Date());
  for(let w=n-1;w>=0;w--){
    const s=new Date(s0); s.setDate(s0.getDate()-7*w); let t=0;
    for(let i=0;i<7;i++){ const d=new Date(s); d.setDate(s.getDate()+i); t+= (+log[dsKey(d)]||0); }
    out.push(t);
  }
  return out;
}
function progStep(x,m){
  const u=x.unit||m.unit||"";
  if(u==="页") return 10;
  if(String(u).indexOf("分钟")>=0) return 20;
  return Math.max(1,+x.step||10);
}
/* P2-3 进度增减：同步维护累计值与本周日志，跨 25/50/75/100% 给一次鼓励 */
const PROG_MILESTONES=[25,50,75,100];
function progPct(x){
  const cur = (x.period==="week") ? weekSum(x.log) : (+x.current||0);
  return Math.min(100, Math.round(cur/Math.max(1,+x.target||1)*100));
}
function bumpProgress(key, x, delta){
  const before=progPct(x);
  x.current=Math.max(0,(+x.current||0)+delta);
  if(x.period==="week"){
    x.log=x.log||{}; const k=dsKey(new Date());
    const nv=Math.max(0,(+x.log[k]||0)+delta);
    if(nv<=0) delete x.log[k]; else x.log[k]=nv;
  }
  const after=progPct(x);
  const hit=PROG_MILESTONES.find(v=>before<v && after>=v && before<100);
  if(hit){ x.milestone=hit; bump([20,40,20]); toast(`${icon("target",14)} 进度 ${hit}% · ${esc(x.title||"")}`); }
  else if(delta>0) bump(8);
  persist();
}

/* P2-2 近 n 日完成天数 */
function rateDays(log, n){
  if(!log) return 0;
  let c=0; const d=new Date();
  for(let i=0;i<n;i++){ if(log[d.toISOString().slice(0,10)]) c++; d.setDate(d.getDate()-1); }
  return c;
}
/* P2-2 历史最长连击 */
function bestStreak(log){
  if(!log) return 0;
  const keys=Object.keys(log).filter(k=>log[k]).sort();
  if(!keys.length) return 0;
  let best=1, cur=1;
  for(let i=1;i<keys.length;i++){
    const gap=Math.round((new Date(keys[i]+"T00:00:00") - new Date(keys[i-1]+"T00:00:00"))/86400000);
    cur = gap===1 ? cur+1 : 1;
    if(cur>best) best=cur;
  }
  return best;
}
/* P2-2 打卡计数（兼容旧的 true/false 记录） */
function logCount(log, ds){ return log && log[ds] ? (+log[ds]||1) : 0; }

/* ===================== P2-1 番茄钟 ===================== */
const POMO_MIN = 25;
let pomo = { key:null, id:null, title:"", total:POMO_MIN*60, left:POMO_MIN*60, running:false, timer:null };

function bump(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

function pomoRing(pct){
  const R=15, C=2*Math.PI*R, p=Math.max(0,Math.min(1,pct));
  return `<svg viewBox="0 0 34 34" width="34" height="34"><circle cx="17" cy="17" r="${R}" fill="none" stroke="var(--border)" stroke-width="3"/>`
    + `<circle cx="17" cy="17" r="${R}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" `
    + `stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}" transform="rotate(-90 17 17)"/></svg>`;
}
function pomoEl(){
  let el=$("#pomo"); if(el) return el;
  el=document.createElement("div"); el.id="pomo"; el.className="pomo";
  el.innerHTML=`<span id="pomoRing"></span>
    <div class="pomo-tx"><b id="pomoTime">${POMO_MIN}:00</b><span id="pomoTitle">专注</span></div>
    <button class="pomo-btn" id="pomoToggle" title="暂停 / 继续" aria-label="暂停或继续"></button>
    <button class="pomo-btn" id="pomoStop" title="结束专注" aria-label="结束专注">${icon("close",14)}</button>`;
  document.body.appendChild(el);
  el.querySelector("#pomoToggle").onclick=()=>{ pomo.running=!pomo.running; if(pomo.running) pomoTick(); paintPomo(); };
  el.querySelector("#pomoStop").onclick=()=>stopPomo();
  return el;
}
function paintPomo(){
  const el=$("#pomo"); if(!el) return;
  const left=Math.max(0,pomo.left);
  const mm=String(Math.floor(left/60)).padStart(2,"0"), ss=String(left%60).padStart(2,"0");
  el.querySelector("#pomoTime").textContent=`${mm}:${ss}`;
  el.querySelector("#pomoTitle").textContent=(pomo.running?"专注中 · ":"已暂停 · ")+(pomo.title||"");
  el.querySelector("#pomoRing").innerHTML=pomoRing(1-pomo.left/pomo.total);
  el.querySelector("#pomoToggle").innerHTML=icon(pomo.running?"pause":"play",13);
}
function pomoTick(){
  clearInterval(pomo.timer);
  pomo.timer=setInterval(()=>{
    if(!pomo.running) return;
    pomo.left--;
    if(pomo.left<=0){ pomoFinish(); return; }
    paintPomo();
  },1000);
}
function startPomo(key,item){
  if(pomo.running && pomo.key===key && pomo.id===item.id){ toast("这一项正在专注中"); return; }
  clearInterval(pomo.timer);
  pomo={ key:key, id:item.id, title:item.title||"专注", total:POMO_MIN*60, left:POMO_MIN*60, running:true, timer:null };
  pomoEl().classList.add("show");
  paintPomo(); pomoTick();
  toast(`开始专注 ${POMO_MIN} 分钟 · ${esc(item.title||"")}`);
}
function pomoFinish(){
  clearInterval(pomo.timer);
  const k=pomo.key, id=pomo.id;
  pomo={ key:null, id:null, title:"", total:POMO_MIN*60, left:POMO_MIN*60, running:false, timer:null };
  const x=(data[k]||[]).find(i=>i.id==id);
  if(x) x.focus=(x.focus||0)+1;
  bump([30,60,30]);
  const el=$("#pomo"); if(el) el.classList.remove("show");
  toast(`${icon("clock",14)} 专注完成！已累计 ${x?(x.focus||1):1} 次`);
  persist();
}
function stopPomo(){
  clearInterval(pomo.timer);
  pomo={ key:null, id:null, title:"", total:POMO_MIN*60, left:POMO_MIN*60, running:false, timer:null };
  const el=$("#pomo"); if(el) el.classList.remove("show");
}

/* ===================== P2-1 拖拽排序 ===================== */
function wireDrag(key){
  const screen=$("#screen");
  const rows=()=>[...screen.querySelectorAll(".rec[data-rid]")].filter(n=>n.querySelector(".js-drag"));
  screen.querySelectorAll(".js-drag").forEach(h=>{
    h.addEventListener("pointerdown", ev=>{
      if(ev.button && ev.button!==0) return;
      ev.preventDefault(); ev.stopPropagation();
      const el=h.closest("[data-rid]"); if(!el) return;
      el.classList.add("dragging");
      try{ h.setPointerCapture(ev.pointerId); }catch(e){}
      const onMove=e2=>{
        const list=rows(); if(!list.length) return;
        const y=e2.clientY;
        let target=list.findIndex(n=>{ const r=n.getBoundingClientRect(); return y < r.top + r.height*0.55; });
        if(target<0) target=list.length-1;
        const cur=list.indexOf(el); if(cur<0 || target<0 || target===cur) return;
        const ref = target>cur ? list[target].nextElementSibling : list[target];
        el.parentNode.insertBefore(el, ref);
      };
      const onUp=()=>{
        h.removeEventListener("pointermove",onMove);
        h.removeEventListener("pointerup",onUp);
        h.removeEventListener("pointercancel",onUp);
        el.classList.remove("dragging");
        const ids=rows().map(n=>n.dataset.rid);
        const arr=data[key]||[];
        arr.sort((a,b)=>{
          const ia=ids.findIndex(v=>v==String(a.id)), ib=ids.findIndex(v=>v==String(b.id));
          return (ia<0?9999:ia)-(ib<0?9999:ib);
        });
        persist();
        toast("顺序已保存");
      };
      h.addEventListener("pointermove",onMove);
      h.addEventListener("pointerup",onUp);
      h.addEventListener("pointercancel",onUp);
    });
  });
}

/* ===================== P2-1 每日自动结转 ===================== */
function ensureTodoRollover(){
  const t=today();
  if(data.__todoLastDay===t) return;
  const prev=data.__todoLastDay;
  if(data.__todoRollover===false){ data.__todoLastDay=t; store.save(); return; }
  if(prev && prev<t){
    const list=data.todo||[];
    const done=list.filter(x=>x.done);
    const undone=list.filter(x=>!x.done);
    if(done.length){
      data.__todoArchive=data.__todoArchive||{};
      data.__todoArchive[prev]=(data.__todoArchive[prev]||[]).concat(done.map(x=>({ id:x.id, title:x.title, focus:x.focus||0 })));
      const keys=Object.keys(data.__todoArchive).sort();
      while(keys.length>30){ delete data.__todoArchive[keys.shift()]; }
    }
    undone.forEach(x=>{ x.carriedDays=(x.carriedDays||0)+1; });
    data.todo=undone;
    if(done.length||undone.length){
      setTimeout(()=>toast(`昨日归档 ${done.length} 项完成记录，${undone.length} 项顺延到今天`), 800);
    }
  }
  data.__todoLastDay=t;
  store.save();
}

function renderTodoArchive(){
  const arch=data.__todoArchive||{};
  const keys=Object.keys(arch).sort().reverse().slice(0,7);
  if(!keys.length) return "";
  const CHEV='<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const rows=keys.map(dk=>{
    const arr=arch[dk]||[];
    const items=arr.map(x=>`<div class="rec arch-rec"><div class="top"><div class="body" style="padding-right:0">`
      + `<div class="rname done">${esc(x.title)}</div>`
      + `${x.focus?`<div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${icon("clock",11)} 专注 ${x.focus} 次</span></div>`:''}`
      + `</div></div></div>`).join("");
    return `<div class="grp">
      <div class="grp-head js-collapse collapsed">${CHEV}<span class="grp-title">${esc(dk)}</span><span class="grp-sum"><span class="gs">完成 ${arr.length} 项</span></span></div>
      <div class="grp-body">${items}</div>
    </div>`;
  }).join("");
  return `<div class="sec-title">${icon("archive",15)} 已完成归档<span class="more">近 7 天</span></div><div class="rec-arch">${rows}</div>`;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){
      x.log=x.log||{};
      const tt=today(); const goal=Math.max(1,+x.goal||1);
      if(goal<=1){ x.log[tt]?delete x.log[tt]:x.log[tt]=1; }
      else { x.log[tt]=Math.min(goal, logCount(x.log,tt)+1); }
      bump(10);
    }
    persist();
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  if(m.type==="checkin") wireCalendar(key, data[key]||[]);
  $("#screen").querySelectorAll(".js-collapse").forEach(el=>el.onclick=()=>{
    el.classList.toggle("collapsed");
    if(el.classList.contains("month")){
      const mk=el.dataset.mk; data.__financeCollapsed=data.__financeCollapsed||{}; data.__financeCollapsed[mk]=el.classList.contains("collapsed"); store.save();
    }
  });
  $("#screen").querySelectorAll(".fchip").forEach(el=>el.onclick=()=>{
    if(el.dataset.ftype!==undefined) financeFilter.type=el.dataset.ftype;
    if(el.dataset.fcat!==undefined) financeFilter.cat=el.dataset.fcat;
    renderModule(key);
  });
  $("#screen").querySelectorAll(".js-budget").forEach(el=>el.onclick=()=>{
    const v=window.prompt("设置每月支出预算（元，0 表示不限制）：", data.__budget||"");
    if(v===null) return; const n=Math.max(0, +v||0); data.__budget=n; persist();
  });
  // P2-1 子任务勾选
  $("#screen").querySelectorAll(".js-sub").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const x=(data[key]||[]).find(i=>i.id==el.dataset.id); if(!x||!x.subs) return;
    const sub=x.subs[+el.dataset.i]; if(!sub) return;
    sub.done=!sub.done;
    if(x.subs.length && x.subs.every(t=>t.done)) x.done=true;
    else if(x.subs.some(t=>!t.done)) x.done=false;
    bump(10); persist();
  });
  // P2-3 进度快捷 +N / -N
  $("#screen").querySelectorAll(".js-prog").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const x=(data[key]||[]).find(i=>i.id==el.dataset.id); if(!x) return;
    bumpProgress(key, x, +el.dataset.n||0);
  });
  // P2-2 打卡减一
  $("#screen").querySelectorAll(".js-ckminus").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const x=(data[key]||[]).find(i=>i.id==el.dataset.id); if(!x) return;
    x.log=x.log||{}; const tt=today();
    const c=logCount(x.log,tt)-1;
    if(c<=0) delete x.log[tt]; else x.log[tt]=c;
    persist();
  });
  // P2-1 番茄钟
  $("#screen").querySelectorAll(".js-focus").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const x=(data[key]||[]).find(i=>i.id==el.dataset.id); if(!x) return;
    startPomo(key,x);
  });
  // P2-1 拖拽排序（仅 todo）
  if(m.type==="todo") wireDrag(key);
}

  const d = item || newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>子任务（每行一个）</label><textarea id="f-subs" placeholder="拆成小步，一行一个：&#10;查资料&#10;写初稿&#10;校对一遍">${esc((d.subs||[]).map(sub=>sub.t).join("\n"))}</textarea></div>

      <div class="frow"><div class="field"><label>每日目标</label><input id="f-goal" type="number" min="1" value="${Math.max(1,+d.goal||1)}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||"次")}" placeholder="杯 / 次 / 组"/></div></div>
      <p class="sub" style="margin:0">目标 = 1 即为「打 / 不打」式打卡；目标 &gt; 1 时点方块每次 +1、可累计到目标。月历里点过去的日期可以直接补签。</p>`;

    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>目标周期</label><div class="seg" id="f-period">
        <div class="opt ${d.period!=='week'?'on':''}" data-v="total">累计目标</div>
        <div class="opt ${d.period==='week'?'on':''}" data-v="week">每周目标</div></div>
        <p class="sub" style="margin:8px 0 0">每周目标会按周一到周日累计本周完成量，并在洞察里出近 12 周趋势。</p></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>周期记账</label><div class="seg" id="f-repeat">

      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}

      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="checkin"){ d.goal=Math.max(1,+val("#f-goal")||1); d.unit=(val("#f-unit")||"次").trim()||"次"; }
    if(m.type==="todo"){
      d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim();
      const oldSubs=d.subs||[];
      d.subs=(val("#f-subs")||"").split("\n").map(t=>t.trim()).filter(Boolean)
        .map(t=>{ const prev=oldSubs.find(o=>o.t===t); return { t:t, done: prev?!!prev.done:false }; });
      if(d.subs.length && d.subs.every(t=>t.done)) d.done=true;
    }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1);
      d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); d.period=seg("#f-period")||"total"; }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); d.repeat=(seg("#f-repeat")==="repeat"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:"", subs:[]};
  else if(m.type==="checkin") item={...base, title:"", log:{}, goal:1, unit:"次"};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:"", period:"total", log:{}};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday(), repeat:false};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ---------- router / nav ---------- */
function go(v){ view=v; closeDrawer(); render(); window.scrollTo({top:0}); }
function render(){
  if(view==="search"){ $("#topTitle").firstChild.textContent="搜索"; $("#topSub").textContent="跨模块查找记录"; $("#nav").querySelectorAll(".n").forEach(n=>n.classList.remove("active")); renderSearch(); return; }
  // top title
  if(view==="home"){ $("#topTitle").firstChild.textContent=CONFIG.owner; $("#topSub").textContent=CONFIG.slogan; }
  else if(view==="insight"){ $("#topTitle").firstChild.textContent="洞察"; $("#topSub").textContent="统计与复盘"; }
  else { const m=modOf(view); $("#topTitle").firstChild.textContent=m?m.name:CONFIG.owner; $("#topSub").textContent=m?m.desc:""; }
  // nav active
  $("#nav").querySelector('[data-nav="home"]').classList.toggle("active", view==="home");
  $("#nav").querySelector('[data-nav="insight"]').classList.toggle("active", view==="insight");
  // render body
  if(view==="home") renderHome();
  else if(view==="insight") renderInsight();
  else renderModule(view);
}

/* ---------- 全局搜索（跨模块） ---------- */
function renderSearch(){
  $("#screen").innerHTML = `
    <div class="sec-title">搜索</div>
    <div class="search-box"><span class="s-ic">${icon("search",18)}</span>
      <input id="searchInput" type="search" placeholder="搜索任务、记账、笔记、灵感…" value="${attr(searchQuery)}" autocomplete="off"/>
      ${searchQuery?`<button class="s-clear" id="sClear">${icon("close",16)}</button>`:""}</div>
    <div id="searchResults"></div>`;
  const inp=$("#searchInput");
  inp.focus();
  inp.oninput=()=>{ searchQuery=inp.value.trim(); renderSearchResults(); };
  const clr=$("#sClear"); if(clr) clr.onclick=()=>{ searchQuery=""; inp.value=""; inp.focus(); renderSearchResults(); };
  renderSearchResults();
}
function renderSearchResults(){
  const box=$("#searchResults"); if(!box) return;
  const q=searchQuery.toLowerCase();
  if(!q){ box.innerHTML=`<div class="empty"><span class="e">${icon("search",26)}</span><div>输入关键词，跨所有模块查找记录</div></div>`; return; }
  const groups=[];
  CONFIG.modules.forEach(m=>{
    const hits=(data[m.key]||[]).filter(x=>{
      const hay=[x.title,x.content,x.note,x.category,x.mood,x.priority,x.type,(x.log&&typeof x.log==="object"?Object.keys(x.log).length+"":""),x.date]
        .filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    });
    if(hits.length) groups.push({m,hits});
  });
  if(!groups.length){ box.innerHTML=`<div class="empty"><span class="e">${icon("search",26)}</span><div>没有找到匹配「${esc(searchQuery)}」的记录</div></div>`; return; }
  box.innerHTML=groups.map(({m,hits})=>`
    <div class="sec-title">${icon(m.icon,15)} ${m.name}<span class="more">${hits.length} 条</span></div>
    ${hits.map(x=>`<div class="search-rec" data-goto="${m.key}" data-rid="${x.id}">${recHTML(m,x)}</div>`).join("")}
  `).join("");
  box.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.goto, rid=el.dataset.rid; view=k; render();
    setTimeout(()=>{ const t=document.querySelector(`[data-rid="${rid}"]`); if(t){ t.scrollIntoView({block:"center"}); t.classList.add("flash"); } },60);
  });
}

/* ---------- drawer ---------- */
function buildDrawer(){
  $("#drawerName").textContent=CONFIG.owner;
  $("#drawerSlogan").textContent=CONFIG.slogan;
  const items=[`<div class="ditem" data-go="home">${icon("home",20)}首页</div>`]
    .concat(CONFIG.modules.map(m=>`<div class="ditem" data-go="${m.key}">${icon(m.icon,20)}${m.name}</div>`))
    .concat([`<div class="ditem" data-go="insight">${icon("chart",20)}洞察</div>`]);
  $("#drawerList").innerHTML=items.join("");
  $("#drawerList").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));

  // 数据工具：导出 / 导入 / 帮助
  $("#drawerTools").innerHTML = [
    `<div class="ditem" data-tool="export">${icon("download",20)}导出数据</div>`,
    `<div class="ditem" data-tool="import">${icon("upload",20)}导入数据</div>`,
    `<div class="ditem" data-tool="rollover">${icon("repeat",20)}每日自动结转<span class="dstate">${data.__todoRollover===false?"已关闭":"已开启"}</span></div>`,
    `<div class="ditem" data-tool="help">${icon("book",20)}玩法 / 帮助</div>`,
  ].join("");
  $("#drawerTools").querySelectorAll("[data-tool]").forEach(el=>{
    el.onclick = () => {
      const t = el.dataset.tool;
      closeDrawer();
      setTimeout(() => {
        if(t==="export") exportData();
        else if(t==="import") $("#importInput").click();
        else if(t==="rollover"){
          const cur=(data.__todoRollover!==false);
          data.__todoRollover=!cur; store.save(); buildDrawer();
          toast(data.__todoRollover?"已开启：未完成任务次日自动顺延":"已关闭每日自动结转");
        }
        else if(t==="help") showOnboarding();
      }, 180);
    };
  });
}
function openDrawer(){
  $("#drawerList").querySelectorAll(".ditem").forEach(el=>el.classList.toggle("active", el.dataset.go===view));
  $("#drawer").classList.add("show"); $("#scrim").classList.add("show");
}
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); }

/* ---------- wire chrome ---------- */
$("#btn-menu").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>{
  const t=n.dataset.nav;
  if(t==="drawer") openDrawer();
  else go(t);
});

/* ---------- avatar upload ---------- */
$("#brandCam").innerHTML = icon("camera",18);
if(data.__avatar) $("#brandImg").src = data.__avatar;
$("#drawerBrand").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { data.__avatar = reader.result; $("#brandImg").src = reader.result; store.save(); };
  reader.readAsDataURL(f);
  e.target.value = "";
};

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, kind="info"){
  let t = $("#wbToast");
  if(!t){ t = document.createElement("div"); t.id="wbToast"; t.className="cal-toast"; document.body.appendChild(t); }
  t.innerHTML = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), kind==="error" ? 5000 : 2800);
}

/* ---------- confirm modal ---------- */
function confirmBox({ title="确认", sub="", okText="确定", okClass="btn", cancelText="取消" }){
  return new Promise(resolve => {
    const overlay = document.createElement("div"); overlay.className="overlay";
    overlay.innerHTML = `<div class="modal"><div class="grab"></div><h2>${esc(title)}</h2>
      ${sub?`<div class="sub">${sub}</div>`:''}
      <div class="modal-actions"><button class="btn ghost" id="cb-cancel">${esc(cancelText)}</button>
      <button class="${okClass}" id="cb-ok">${esc(okText)}</button></div></div>`;
    document.body.appendChild(overlay);
    const close = v => { overlay.remove(); resolve(v); };
    overlay.onclick = e => { if(e.target===overlay) close(false); };
    overlay.querySelector("#cb-cancel").onclick = () => close(false);
    overlay.querySelector("#cb-ok").onclick = () => close(true);
  });
}

/* ---------- data import / export ---------- */
const EXPORT_APP = "workbench-mobile";
const EXPORT_VERSION = 1;

function exportData(){
  if(!data || Object.keys(data).length===0){
    toast("当前没有数据可以导出", "error");
    return;
  }
  const payload = {
    app: EXPORT_APP,
    version: EXPORT_VERSION,
    storageKey: CONFIG.storageKey,
    exportedAt: new Date().toISOString(),
    owner: CONFIG.owner,
    data: data,
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ds = isoToday().replaceAll("-","");
  a.href = url;
  a.download = `workbench-backup-${ds}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`已导出 ${Object.keys(data).length} 个分组的数据`);
}

$("#importInput").onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  if(f.size > 16 * 1024 * 1024){
    toast("文件过大，请确认是否为正确的备份文件", "error");
    return;
  }
  let parsed;
  try{
    parsed = JSON.parse(await f.text());
  }catch(err){
    toast("文件不是有效的 JSON，导入失败", "error");
    return;
  }
  const incoming = (parsed && typeof parsed==="object" && parsed.app===EXPORT_APP && parsed.data && typeof parsed.data==="object")
    ? parsed.data
    : (parsed && typeof parsed==="object" && !Array.isArray(parsed) ? parsed : null);
  if(!incoming){
    toast("未识别到可导入的数据结构", "error");
    return;
  }
  const ok = await confirmBox({
    title: "导入数据",
    sub: `将用备份内容覆盖当前本机数据，此操作不可撤销。导入后建议刷新页面。`,
    okText: "覆盖导入",
    okClass: "btn danger",
  });
  if(!ok) return;
  const merged = {};
  CONFIG.modules.forEach(m => { merged[m.key] = Array.isArray(incoming[m.key]) ? incoming[m.key] : (structuredClone(m.seed||[])); });
  if(incoming.__trend) merged.__trend = incoming.__trend;
  if(incoming.__avatar) merged.__avatar = incoming.__avatar;
  data = merged;
  store.save();
  if(merged.__avatar) $("#brandImg").src = merged.__avatar;
  toast("导入成功，正在刷新…");
  setTimeout(() => location.reload(), 800);
};

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

function ensureRecurring(){
  const cur = today().slice(0,7);
  if(data.__clonedMonth===cur) return;
  const fin = data.finance||[];
  const prevs = [...new Set(fin.filter(x=>x.repeat && x.date && x.date.slice(0,7)<cur).map(x=>x.date.slice(0,7)))].sort();
  if(prevs.length){
    const srcMonth = prevs[prevs.length-1];
    fin.filter(x=>x.repeat && x.date && x.date.slice(0,7)===srcMonth).forEach(x=>{
      const day = x.date.slice(8);
      const clone = Object.assign({}, x, { id: Date.now()+Math.floor(Math.random()*1000), date: cur+"-"+day, repeat:true });
      fin.unshift(clone);
    });
  }
  data.__clonedMonth = cur;
  persist();
}

function showOnboarding(){
  const mods = CONFIG.modules.map(m=>`<div class="ob-mod">${icon(m.icon,18)}<div><b>${esc(m.name)}</b><span>${esc(m.desc)}</span></div></div>`).join("");
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal ob">
    <div class="grab"></div>
    <h2>欢迎来到 ${esc(CONFIG.owner)}</h2>
    <div class="sub">${esc(CONFIG.slogan)}</div>
    <div class="ob-mods">${mods}</div>
    <p class="ob-warn">${icon("database",15)} 所有数据只保存在本机浏览器，清缓存或换设备会丢失，记得常点「导出数据」备份。</p>
    <div class="modal-actions"><button class="btn" id="ob-ok">开始使用</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#ob-ok").onclick=()=>{ data.__onboarded=true; store.save(); overlay.remove(); };
}

ensureRecurring();
ensureTodoRollover();
buildDrawer();
render();
if(!data.__onboarded) showOnboarding();
</script>
