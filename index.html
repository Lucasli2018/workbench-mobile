<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>汪汪时间管理局</title>
<!-- PWA：可安装 / 离线可用 -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1e3a5f" />
<meta name="description" content="一只卡通小狗 × 未来时间管理局的每日个人工作台" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="汪汪工作台" />
<link rel="apple-touch-icon" href="workbench-assets/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="workbench-assets/icon-192.png" />

<!-- 首屏前应用外观，避免深色模式闪白。存储键须与 config.js 的 CONFIG.storageKey 一致。 -->
<script>
(function () {
  try {
    var d = JSON.parse(localStorage.getItem("workbench-doggy-v1") || "{}");
    var pref = d.__theme || "auto";
    var dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var e = document.documentElement;
    e.setAttribute("data-theme", dark ? "dark" : "light");
    e.setAttribute("data-skin", d.__skin || "blue");
    e.setAttribute("data-fs", d.__fs || "mid");   // 三档字号：首屏前生效，避免跳字
  } catch (err) { /* 读取失败则用默认浅色 */ }
})();
</script>

<!-- 样式按层加载：令牌 → 基础 → 组件 → 业务 → 系统 -->
<link rel="stylesheet" href="src/css/01-tokens.css" />
<link rel="stylesheet" href="src/css/02-base.css" />
<link rel="stylesheet" href="src/css/03-components.css" />
<link rel="stylesheet" href="src/css/04-features.css" />
<link rel="stylesheet" href="src/css/05-system.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="menu-btn" id="btn-menu"></button>
    <div class="title" id="topTitle">我的工作台<small id="topSub">Personal Workbench</small></div>
    <span class="date-chip" id="dateChip"></span>
    <button class="menu-btn" id="btn-search"></button>
  </div>
  <!-- 页面容器：内容由 router.js 写入，首屏先占位骨架屏 -->
  <div id="screen"><div class="sk" id="bootSk" aria-hidden="true"><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div></div></div>
</div>

<!-- bottom nav -->
<div class="nav" id="nav">
  <div class="n active" data-nav="home"></div>
  <div class="n" data-nav="drawer"></div>
  <div class="n" data-nav="insight"></div>
</div>

<!-- drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dh">
    <button class="dclose" id="drawerClose"></button>
    <div class="brand" id="drawerBrand" title="点击更换头像"><img src="workbench-assets/avatar.webp" alt="头像" id="brandImg"/><span class="brand-cam" id="brandCam"></span></div>
    <input type="file" id="avatarInput" accept="image/*" hidden/>
    <div><h2 id="drawerName">我的工作台</h2><p id="drawerSlogan">Personal Workbench</p></div>
  </div>
  <div class="dsep"></div>
  <div id="drawerList"></div>
  <div class="dsep"></div>
  <div id="drawerTools"></div>
  <div class="dsep"></div>
  <div class="dfoot" id="drawerFoot">汪汪时间管理局 · 数据仅存本机 · 每日更新</div>
  <input type="file" id="importInput" accept="application/json,.json" hidden/>
</aside>

<!--
  脚本为经典 <script>（非 ES module），共享同一全局作用域，
  因此仍可直接双击 index.html 打开，无需构建、无需本地服务器。
  加载顺序即依赖顺序：core → config → ui → features → data → system → boot。
-->
<script src="src/js/core/date.js"></script>
<script src="src/js/core/utils.js"></script>
<script src="src/js/config.js"></script>
<script src="src/js/core/store.js"></script>
<script src="src/js/ui/charts.js"></script>
<script src="src/js/ui/overlays.js"></script>
<script src="src/js/features/stats.js"></script>
<script src="src/js/features/home.js"></script>
<script src="src/js/features/insight.js"></script>
<script src="src/js/features/finance.js"></script>
<script src="src/js/features/notes.js"></script>
<script src="src/js/features/todo.js"></script>
<script src="src/js/features/trash.js"></script>
<script src="src/js/ui/records.js"></script>
<script src="src/js/ui/drawer.js"></script>
<script src="src/js/ui/gestures.js"></script>
<script src="src/js/ui/panels.js"></script>
<script src="src/js/data/safety.js"></script>
<script src="src/js/data/transfer.js"></script>
<script src="src/js/core/router.js"></script>
<script src="src/js/system/a11y.js"></script>
<script src="src/js/system/theme.js"></script>
<script src="src/js/system/pwa.js"></script>
<script src="src/js/boot.js"></script>
</body>
</html>
